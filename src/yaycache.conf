# Configuration for yaycache.service (the unit run by yaycache.timer).
#
# YAYCACHE_ARGS holds the flags and extra arguments appended to `yaycache -r`
# when the service runs. Quote the whole value; systemd splits it on
# whitespace and honours quotes inside it. See `man 8 yaycache` or
# `yaycache --help` for the available options.
#
# A per-user copy at $XDG_CONFIG_HOME/yaycache.conf (~/.config/yaycache.conf)
# overrides this file.
#
# Examples:
#   YAYCACHE_ARGS="-k2"
#   YAYCACHE_ARGS="-k1 --remove-build-files --min-mtime '30 days ago'"

YAYCACHE_ARGS=
